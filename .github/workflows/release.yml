# Creates a tag and a GitHub release when the plugin version in
# .claude-plugin/plugin.json changes on main. Does nothing when the tag exists.
name: Release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          package=$(jq -r .version package.json)
          if [ "$plugin" != "$package" ]; then
            echo "::error::plugin.json ($plugin) and package.json ($package) have different versions"
            exit 1
          fi
          echo "tag=v$plugin" >> "$GITHUB_OUTPUT"

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
